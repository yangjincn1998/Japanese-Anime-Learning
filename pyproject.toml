[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-learning"
version = "0.1.0"
description = "Local Japanese learning database, subtitle analysis, and Anki synchronization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "SQLAlchemy>=2.0,<3",
]

[project.scripts]
japanese-learning = "japanese_learning.cli:main"
jlpt-db = "japanese_learning.cli:main"

[dependency-groups]
dev = [
    "black>=25.1",
    "pytest>=8.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["japanese_learning*"]

[tool.setuptools.package-data]
japanese_learning = [
    "migrations/*.mako",
    "migrations/*.py",
    "migrations/versions/*.py",
]

[tool.black]
target-version = ["py311"]
line-length = 88
